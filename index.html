<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasound Question Bank Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.5;
        }

        .quiz-wrapper {
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            max-width: 1100px;
            margin: 0 auto;
        }

        #quiz {
            width: 100%;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
        }

        /* Header: nav + info in one bar */
        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #333;
            background-color: #0a0a0a;
            flex-shrink: 0;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #aaa;
        }

        .question-counter {
            color: #ccc;
            font-weight: 500;
        }

        .progress {
            color: #888;
        }

        .save-status {
            color: #888;
            font-size: 12px;
        }

        .save-status.saved {
            color: #4a4;
        }

        .nav-btn {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 7px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background-color: #2a2a2a;
            border-color: #555;
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: default;
        }

        .nav-btn:disabled:hover {
            background-color: #1a1a1a;
            border-color: #444;
        }

        /* Stem */
        .question-stem {
            padding: 14px 20px;
            font-size: 18px;
            flex-shrink: 0;
            border-bottom: 1px solid #222;
        }

        /* Content: image + answers side by side */
        .question-content {
            display: flex;
            gap: 16px;
            padding: 12px 20px;
            overflow: auto;
        }

        .image-column {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        .image-column img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #333;
            border-radius: 3px;
        }

        .answers-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        /* No-image: answers centered full-width */
        .question-content.no-image {
            justify-content: center;
            align-items: center;
        }

        .question-content.no-image .answers-column {
            max-width: 750px;
            width: 100%;
        }

        .answers {
            margin: 0;
        }

        .answer-option {
            margin: 5px 0;
            border-radius: 5px;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }

        .answer-option:hover {
            background-color: #1a1a1a;
            border-color: #444;
        }

        .answer-option label {
            cursor: pointer;
            display: block;
            padding: 10px 14px;
            font-size: 16px;
        }

        .answer-option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
            transform: scale(1.15);
        }

        .note {
            margin: 8px 0 0;
            padding: 8px 10px;
            background-color: #1a1a1a;
            border-left: 3px solid #666;
            font-size: 13px;
            font-style: italic;
        }

        /* Cheat-proof modal */
        .cheat-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .cheat-overlay.show {
            display: flex;
        }

        .cheat-modal {
            background: #111;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 40px 50px;
            max-width: 550px;
            text-align: center;
            animation: cheatPop 0.3s ease-out;
        }

        @keyframes cheatPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cheat-modal .quote {
            font-size: 20px;
            font-style: italic;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .cheat-modal button {
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .cheat-modal button:hover {
            background-color: #333;
            border-color: #777;
        }

        /* Submit page */
        .submit-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 20px;
        }

        .submit-content label {
            font-size: 18px;
            color: #ccc;
        }

        .submit-content input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1a1a1a;
            color: #fff;
            outline: none;
        }

        .submit-content input[type="text"]:focus {
            border-color: #666;
        }

        .submit-btn {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 500;
            background-color: #1a6b35;
            color: #fff;
            border: 1px solid #2a8a4a;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background-color: #228b44;
            border-color: #3a9a5a;
        }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .submit-warning {
            color: #888;
            font-size: 13px;
            text-align: center;
            max-width: 400px;
        }

        @media print {
            body { background-color: #fff; color: #000; }
            .question-header { display: none; }
        }
    </style>
</head>

        let currentQuestionIndex = 0;

        function showCheatPopup() {
            const now = Date.now();
            if (now - lastPopupTime < 1500) return;
            lastPopupTime = now;
            const quote = cheatQuotes[Math.floor(Math.random() * cheatQuotes.length)];
            document.getElementById('cheatQuote').textContent = quote;
            document.getElementById('cheatOverlay').classList.add('show');
        }

        function closeCheatModal() {
            document.getElementById('cheatOverlay').classList.remove('show');
        }

        // --- Cheat-proofing ---
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                showCheatPopup();
            }
            if (e.key === 'Escape') closeCheatModal();
            if (e.key === 'ArrowRight') nextQuestion();
            if (e.key === 'ArrowLeft') prevQuestion();
        });

        // --- Render a single question into the quiz container ---
        function showQuestion(index) {
            currentQuestionIndex = index;
            const q = questions[index];
            const savedData = loadData();
            const container = document.getElementById('quiz');

            const prevDisabled = index === 0 ? 'disabled' : '';
            const nextDisabled = index === questions.length - 1 ? 'disabled' : '';

            // Submit page
            if (q.type === 'submit') {
                const savedName = localStorage.getItem('qbankQuizName') || '';
                container.innerHTML =
                    '<div class="question-header">' +
                        '<button class="nav-btn" onclick="prevQuestion()" ' + prevDisabled + '>&#8592; Prev</button>' +
                        '<div class="header-center">' +
                            '<span class="question-counter">Submit</span>' +
                            '<span class="progress" id="progress"></span>' +
                            '<span class="save-status" id="saveStatus"></span>' +
                        '</div>' +
                        '<button class="nav-btn" disabled>Next &#8594;</button>' +
                    '</div>' +
                    '<div class="question-stem">' + q.stem + '</div>' +
                    '<div class="submit-content">' +
                        '<label for="playerName">Enter your name</label>' +
                        '<input type="text" id="playerName" placeholder="First and Last Name" value="' + savedName.replace(/"/g, '&quot;') + '">' +
                        '<button class="submit-btn" id="submitBtn" onclick="submitQuiz()">Submit</button>' +
                        '<p class="submit-warning" id="submitMsg"></p>' +
                    '</div>';
                updateProgress();
                var nameInput = document.getElementById('playerName');
                if (nameInput) {
                    nameInput.addEventListener('input', function() {
                        localStorage.setItem('qbankQuizName', nameInput.value);
                    });
                }
                return;
            }

            let answersHtml = '';
            q.answers.forEach((answer, i) => {
                const id = 'q' + q.number + '_a' + i;
                const checked = savedData[q.number]?.selected === i ? 'checked' : '';
                answersHtml += '<div class="answer-option"><label for="' + id + '">' +
                    '<input type="radio" name="q' + q.number + '" id="' + id + '" value="' + i + '" ' + checked + ' onchange="handleAnswer()">' +
                    answer + '</label></div>';
            });

            let contentHtml;
            if (q.image) {
                contentHtml = '<div class="question-content">' +
                    '<div class="image-column"><img src="' + q.image + '" alt="Question ' + q.number + ' image" draggable="false"></div>' +
                    '<div class="answers-column"><div class="answers">' + answersHtml + '</div>' +
                    (q.note ? '<div class="note">Note: ' + q.note + '</div>' : '') +
                    '</div></div>';
            } else {
                contentHtml = '<div class="question-content no-image">' +
                    '<div class="answers-column"><div class="answers">' + answersHtml + '</div>' +
                    (q.note ? '<div class="note">Note: ' + q.note + '</div>' : '') +
                    '</div></div>';
            }

            container.innerHTML =
                '<div class="question-header">' +
                    '<button class="nav-btn" onclick="prevQuestion()" ' + prevDisabled + '>&#8592; Prev</button>' +
                    '<div class="header-center">' +
                        '<span class="question-counter">Question ' + (index + 1) + ' of ' + (questions.length - 1) + '</span>' +
                        '<span class="progress" id="progress"></span>' +
                        '<span class="save-status" id="saveStatus"></span>' +
                    '</div>' +
                    '<button class="nav-btn" onclick="nextQuestion()" ' + nextDisabled + '>Next &#8594;</button>' +
                '</div>' +
                '<div class="question-stem">' + q.stem + '</div>' +
                contentHtml;

            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                showQuestion(currentQuestionIndex - 1);
            }
        }

        function handleAnswer() {
            saveData();
            if (currentQuestionIndex < questions.length - 1) {
                setTimeout(nextQuestion, 800);
            }
        }

        function loadData() {
            const saved = localStorage.getItem('qbankQuiz');
            return saved ? JSON.parse(saved) : {};
        }

        function saveData() {
            const data = loadData();
            const q = questions[currentQuestionIndex];
            var sel = document.querySelector('input[name="q' + q.number + '"]:checked');
            data[q.number] = { selected: sel ? parseInt(sel.value) : null };
            localStorage.setItem('qbankQuiz', JSON.stringify(data));
            showSaveStatus('Saved!');
            updateProgress();
        }

        function showSaveStatus(message) {
            var el = document.getElementById('saveStatus');
            if (el) {
                el.textContent = message;
                el.className = 'save-status' + (message === 'Saved!' ? ' saved' : '');
            }
        }

        function updateProgress() {
            var data = loadData();
            var answered = 0;
            var totalQuestions = questions.filter(function(q) { return q.type !== 'submit'; });
            totalQuestions.forEach(function(q) {
                if (data[q.number]?.selected !== null && data[q.number]?.selected !== undefined) answered++;
            });
            var el = document.getElementById('progress');
            if (el) el.textContent = answered + '/' + totalQuestions.length + ' answered';
        }

        function submitQuiz() {
            var nameInput = document.getElementById('playerName');
            var submitBtn = document.getElementById('submitBtn');
            var submitMsg = document.getElementById('submitMsg');
            var name = nameInput ? nameInput.value.trim() : '';
            if (!name) {
                nameInput.focus();
                nameInput.style.borderColor = '#c44';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            submitMsg.textContent = '';

            var data = loadData();
            var realQuestions = questions.filter(function(q) { return q.type !== 'submit'; });
            var lines = [];
            realQuestions.forEach(function(q) {
                var sel = data[q.number]?.selected;
                var answer = sel !== null && sel !== undefined ? q.answers[sel] : 'No answer';
                lines.push('Q' + q.number + ': ' + answer);
            });

            var answered = 0;
            realQuestions.forEach(function(q) {
                if (data[q.number]?.selected !== null && data[q.number]?.selected !== undefined) answered++;
            });
            lines.push('');
            lines.push('Answered: ' + answered + '/' + realQuestions.length);

            var formData = new FormData();
            formData.append('name', name);
            formData.append('_subject', 'SONOGAMES quiz');
            formData.append('message', lines.join('\n'));
            formData.append('_captcha', 'false');
            formData.append('_template', 'box');

            fetch('https://formsubmit.co/ajax/christian.treat@stonybrookmedicine.edu', {
                method: 'POST',
                body: formData
            })
            .then(function(res) { return res.json(); })
            .then(function(result) {
                if (result.success) {
                    submitBtn.textContent = 'Submitted!';
                    submitBtn.style.backgroundColor = '#2a8a4a';
                    submitMsg.textContent = 'Your answers have been sent.';
                    submitMsg.style.color = '#4a4';
                } else {
                    throw new Error('Submission failed');
                }
            })
            .catch(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
                submitMsg.textContent = 'Something went wrong. Please try again.';
                submitMsg.style.color = '#c44';
            });
        }

        // Initialize
        showQuestion(0);
    </script>
</body>
</html>
