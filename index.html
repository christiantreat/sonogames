<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasound Question Bank Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 400;
        }

        .question-block {
            margin-bottom: 50px;
            padding: 30px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .question-number {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .question-stem {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .answers {
            margin: 20px 0;
        }

        .answer-option {
            margin: 10px 0;
            padding: 10px;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .answer-option:hover {
            background-color: #1a1a1a;
        }

        .answer-option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .answer-option label {
            cursor: pointer;
            display: inline;
        }

        .image-container {
            margin: 20px 0;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            border: 1px solid #333;
            border-radius: 3px;
        }

        .note {
            margin: 15px 0;
            padding: 10px;
            background-color: #1a1a1a;
            border-left: 3px solid #666;
            font-size: 14px;
            font-style: italic;
        }

        .controls {
            position: sticky;
            top: 20px;
            background-color: #000;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 4px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 10;
        }

        .save-status {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-top: 5px;
        }

        .save-status.saved {
            color: #4a4;
        }

        .progress {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }

        /* Cheat-proof modal */
        .cheat-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .cheat-overlay.show {
            display: flex;
        }

        .cheat-modal {
            background: #111;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 40px 50px;
            max-width: 550px;
            text-align: center;
            animation: cheatPop 0.3s ease-out;
        }

        @keyframes cheatPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cheat-modal .quote {
            font-size: 20px;
            font-style: italic;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .cheat-modal button {
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .cheat-modal button:hover {
            background-color: #333;
            border-color: #777;
        }

        @media print {
            body {
                background-color: #fff;
                color: #000;
            }
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ultrasound Question Bank Quiz</h1>

        <div class="controls">
            <div style="width: 100%; text-align: center;">
                <div class="progress" id="progress"></div>
                <div class="save-status" id="saveStatus">Auto-saving enabled</div>
            </div>
        </div>

        <div id="questions"></div>
    </div>

    <!-- Cheat-proof popup -->
    <div class="cheat-overlay" id="cheatOverlay">
        <div class="cheat-modal">
            <div class="quote" id="cheatQuote"></div>
            <button onclick="closeCheatModal()">OK</button>
        </div>
    </div>

    <script>

            },
            {

            {

            {

                stem: "[PLACEHOLDER] Based on this gastric ultrasound, what is the estimated gastric volume and aspiration risk?",
                answers: [

            {

                stem: "[PLACEHOLDER] On musculoskeletal ultrasound of the shoulder, what acromioclavicular (AC) joint separation distance is considered pathologic?",

            {

        // Cheat-proof quotes
        const cheatQuotes = [
            "\u201CI find your lack of faith disturbing.\u201D \u2014 Darth Vader",
            "\u201CYou shall not pass!\u201D \u2014 Gandalf",
            "\u201CYou have no power here!\u201D \u2014 Th\u00E9oden, LOTR",
            "\u201CI\u2019m sorry, Dave. I\u2019m afraid I can\u2019t do that.\u201D \u2014 HAL 9000",
            "\u201CDid you really think it would be that easy?\u201D \u2014 Every villain ever",
            "\u201CNice try, but you\u2019re gonna have to do better than that.\u201D",
            "\u201CCurses! Foiled again!\u201D",
            "\u201CI see through the lies of the Ctrl+C!\u201D",
            "\u201CYour overconfidence is your weakness.\u201D",
            "\u201CNot today.\u201D \u2014 Arya Stark",
            "\u201CI don\u2019t think so, Tim.\u201D \u2014 Home Improvement",
            "\u201CThat\u2019s a bold strategy, Cotton. Let\u2019s see if it pays off for \u2019em.\u201D \u2014 Dodgeball (spoiler: it won\u2019t)"
        ];

        let lastPopupTime = 0;

        function showCheatPopup() {
            const now = Date.now();
            if (now - lastPopupTime < 1500) return;
            lastPopupTime = now;

            const quote = cheatQuotes[Math.floor(Math.random() * cheatQuotes.length)];
            document.getElementById('cheatQuote').textContent = quote;
            document.getElementById('cheatOverlay').classList.add('show');
        }

        function closeCheatModal() {
            document.getElementById('cheatOverlay').classList.remove('show');
        }

        // --- Cheat-proofing event listeners ---

        // Prevent Ctrl+C (copy) and Ctrl+A (select all)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                showCheatPopup();
            }
            if (e.key === 'Escape') {
                closeCheatModal();
            }
        });

        // --- Quiz rendering and data functions ---

        function renderQuestions() {
            const container = document.getElementById('questions');
            const savedData = loadData();

            questions.forEach(q => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-block';
                questionDiv.id = `q${q.number}`;

                let html = `
                    <div class="question-number">Question ${q.number}</div>
                    <div class="question-stem">${q.stem}</div>
                `;

                if (q.image) {
                    html += `
                        <div class="image-container">
                            <img src="${q.image}" alt="Question ${q.number} image" loading="lazy" draggable="false">
                        </div>
                    `;
                }

                html += `<div class="answers">`;

                q.answers.forEach((answer, index) => {
                    const answerId = `q${q.number}_a${index}`;
                    const isChecked = savedData[q.number]?.selected === index ? 'checked' : '';
                    html += `
                        <div class="answer-option">
                            <input type="radio"
                                   name="q${q.number}"
                                   id="${answerId}"
                                   value="${index}"
                                   ${isChecked}
                                   onchange="saveData()">
                            <label for="${answerId}">${answer}</label>
                        </div>
                    `;
                });

                html += `</div>`;

                if (q.note) {
                    html += `<div class="note">Note: ${q.note}</div>`;
                }

                questionDiv.innerHTML = html;
                container.appendChild(questionDiv);
            });

            updateProgress();
        }

        function loadData() {
            const saved = localStorage.getItem('qbankQuiz');
            return saved ? JSON.parse(saved) : {};
        }

        function saveData() {
            const data = {};

            questions.forEach(q => {
                data[q.number] = { selected: null };

                const selected = document.querySelector(`input[name="q${q.number}"]:checked`);
                if (selected) {
                    data[q.number].selected = parseInt(selected.value);
                }
            });

            localStorage.setItem('qbankQuiz', JSON.stringify(data));
            showSaveStatus('Saved!');
            updateProgress();
        }

        function showSaveStatus(message) {
            const status = document.getElementById('saveStatus');
            status.textContent = message;
            status.className = 'save-status' + (message === 'Saved!' ? ' saved' : '');
        }

        function updateProgress() {
            const data = loadData();
            let answered = 0;

            questions.forEach(q => {
                if (data[q.number]?.selected !== null && data[q.number]?.selected !== undefined) {
                    answered++;
                }
            });

            document.getElementById('progress').textContent =
                `Progress: ${answered}/${questions.length} answered`;
        }

        // Initialize
        renderQuestions();
    </script>
</body>
</html>
